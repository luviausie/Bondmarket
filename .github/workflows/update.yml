name: update-data

on:
  schedule:
    - cron: "0 1 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tarik data FRED dan hitung analisa
        run: python scripts/update.py
      - name: Commit bila ada perubahan
        run: |
          git config user.name "bond-terminal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "data: update $(date -u +%F)"
            git push
          fi
